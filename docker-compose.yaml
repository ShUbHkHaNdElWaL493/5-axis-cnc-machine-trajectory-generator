services:
  em-trajectory-generator:
    build:
      context: .
      target: em-trajectory-generator
    image: em-trajectory-generator
    container_name: em-trajectory-generator
    ipc: host
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY:-}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/tmp/.Xauthority}:/root/.Xauthority